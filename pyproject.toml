[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bastionsupply"
version = "0.6.0"
description = "MCP supply-chain security scanner: detect tool-poisoning, shadowing, hidden unicode, secret solicitation, and rug-pull drift in MCP servers before you install them."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stefano Rizzello", email = "rizzellostefano@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "security", "supply-chain", "prompt-injection", "ai-agent", "tool-poisoning", "agent-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["bastioncorpus>=0.3.0"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
bastionsupply = "bastionsupply.cli:main"

[project.urls]
Homepage = "https://github.com/Rinkia/bastionsupply"
Repository = "https://github.com/Rinkia/bastionsupply"
Issues = "https://github.com/Rinkia/bastionsupply/issues"

[tool.setuptools]
packages = ["bastionsupply"]
